<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae392"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#997514"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="80%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- Dark Disc Background -->
  <circle cx="32" cy="32" r="30" fill="url(#badgeBg)"/>

  <!-- Gold Ring Border -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="2,1.5" opacity="0.8"/>

  <!-- Barber Shears (Bold & Clear for 16px/32px Tab Visibility) -->
  <g fill="url(#gold)" stroke="url(#gold)">
    <!-- Scissor Loop 1 (Bottom Left) -->
    <circle cx="21" cy="46" r="5" fill="none" stroke-width="2.2"/>
    <!-- Scissor Blade 1 (Diagonal up-right) -->
    <path d="M 23 42 L 32 32 L 47 16 C 47.5 15.5 48 14.5 48.5 13.5 C 47.5 14 46.5 14.5 46 15 L 30 30 Z" stroke-width="0.5"/>

    <!-- Scissor Loop 2 (Bottom Right) -->
    <circle cx="43" cy="46" r="5" fill="none" stroke-width="2.2"/>
    <!-- Scissor Loop Tang -->
    <path d="M 47 43 C 49 41 50 39 50 38" fill="none" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Scissor Blade 2 (Diagonal up-left) -->
    <path d="M 41 42 L 32 32 L 17 16 C 16.5 15.5 16 14.5 15.5 13.5 C 16.5 14 17.5 14.5 18 15 L 34 30 Z" stroke-width="0.5"/>

    <!-- Center Pivot Screw -->
    <circle cx="32" cy="32" r="2.2" fill="#141414" stroke="url(#gold)" stroke-width="1.2"/>
  </g>

  <!-- Barber Comb (Horizontal Silhouette behind) -->
  <rect x="20" y="27" width="24" height="2.2" rx="0.5" fill="url(#gold)" opacity="0.9"/>
  <!-- Comb Teeth -->
  <line x1="22" y1="29.2" x2="22" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="24" y1="29.2" x2="24" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="26" y1="29.2" x2="26" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="28" y1="29.2" x2="28" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="30" y1="29.2" x2="30" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="34" y1="29.2" x2="34" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="36" y1="29.2" x2="36" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="38" y1="29.2" x2="38" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="40" y1="29.2" x2="40" y2="33" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="42" y1="29.2" x2="42" y2="33" stroke="url(#gold)" stroke-width="0.9"/>

  <!-- Gentleman's Mustache -->
  <path d="M 32 38.5 C 30 37.5 27 36.8 24 38 C 21 39 19.5 41 18.5 42 C 20.5 41.8 23 40.8 25.5 39.8 C 28 38.8 31 39.8 32 40.5 C 33 39.8 36 38.8 38.5 39.8 C 41 40.8 43.5 41.8 45.5 42 C 44.5 41 43 39 40 38 C 37 36.8 34 37.5 32 38.5 Z" 
        fill="url(#gold)"/>
</svg>
