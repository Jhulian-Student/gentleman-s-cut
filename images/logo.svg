<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="70%" stop-color="#dfba45"/>
      <stop offset="100%" stop-color="#967210"/>
    </linearGradient>

    <!-- Dark Badge Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="75%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="256" cy="256" r="240" fill="url(#darkBg)"/>

  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Inner Delicate Gold Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.85"/>

  <!-- Decorative Top Stars -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Center Star -->
    <path d="M 256 70 L 261 82 L 274 83 L 264 91 L 267 104 L 256 97 L 245 104 L 248 91 L 238 83 L 251 82 Z"/>
    <!-- Left Star -->
    <path d="M 224 82 L 227 90 L 236 91 L 229 97 L 231 106 L 224 101 L 217 106 L 219 97 L 212 91 L 221 90 Z" transform="scale(0.85) translate(40, 20)"/>
    <!-- Right Star -->
    <path d="M 288 82 L 291 90 L 300 91 L 293 97 L 295 106 L 288 101 L 281 106 L 283 97 L 276 91 L 285 90 Z" transform="scale(0.85) translate(28, 20)"/>
  </g>

  <!-- Barber Shears (Scissors) - Left Blade / Right Handle -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Scissor Part 1 (Diagonal Left-Up to Right-Down) -->
    <!-- Finger loop -->
    <path d="M 180 375 C 150 405 130 385 145 355 C 158 330 185 340 195 360 C 190 350 195 330 215 315 L 256 268 L 244 256 L 200 300 C 185 305 155 310 135 340 C 110 380 140 430 185 415 C 220 400 220 370 205 350 Z" />
    <!-- Blade 1 -->
    <path d="M 256 256 L 345 150 C 352 142 356 130 360 120 C 350 125 338 132 330 140 L 245 245 Z"/>

    <!-- Scissor Part 2 (Diagonal Right-Up to Left-Down) -->
    <!-- Finger loop & tang -->
    <path d="M 332 375 C 362 405 382 385 367 355 C 354 330 327 340 317 360 C 322 350 317 330 297 315 L 256 268 L 268 256 L 312 300 C 327 305 357 310 377 340 C 402 380 372 430 327 415 C 292 400 292 370 307 350 Z"/>
    <!-- Blade 2 -->
    <path d="M 256 256 L 167 150 C 160 142 156 130 152 120 C 162 125 174 132 182 140 L 267 245 Z"/>

    <!-- Center Pivot Screw -->
    <circle cx="256" cy="256" r="10" fill="#222222" stroke="url(#goldGrad)" stroke-width="4"/>
  </g>

  <!-- Classic Barber Comb in Center Background -->
  <g fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)">
    <!-- Comb spine horizontal across middle -->
    <rect x="156" y="218" width="200" height="14" rx="4"/>
    <!-- Comb teeth -->
    <line x1="166" y1="232" x2="166" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="178" y1="232" x2="178" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="232" x2="190" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="202" y1="232" x2="202" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="214" y1="232" x2="214" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="226" y1="232" x2="226" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="238" y1="232" x2="238" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="250" y1="232" x2="250" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="262" y1="232" x2="262" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="274" y1="232" x2="274" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="286" y1="232" x2="286" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="298" y1="232" x2="298" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="232" x2="310" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="322" y1="232" x2="322" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="334" y1="232" x2="334" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="346" y1="232" x2="346" y2="258" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Gentleman's Mustache at Bottom -->
  <path d="M 256 318 C 242 308 214 300 188 310 C 160 320 150 338 142 350 C 158 348 184 340 206 330 C 228 320 248 328 256 334 C 264 328 284 320 306 330 C 328 340 354 348 370 350 C 362 338 352 320 324 310 C 298 300 270 308 256 318 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Brand Typography Arc / Text -->
  <text x="256" y="445" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="28" 
        font-weight="bold" 
        letter-spacing="5">THE GENTLEMAN'S CUT</text>
  <text x="256" y="470" 
        text-anchor="middle" 
        fill="#e6c86e" 
        font-family="'Arial', sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="6">EST. 2024</text>
</svg>
